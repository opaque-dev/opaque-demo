name: Standalone demo validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build standalone demo
        run: cargo build --locked --workspace
      - name: Smoke standalone metrics initialization with ephemeral keys
        run: python3 -B scripts/metrics_chat_dogfood.py --prepare-only --no-build
      - name: Build source-bound standalone artifact
        run: python3 -B scripts/build_hosted_artifact.py build --demo-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/demo-artifact" --profile debug
      - name: Verify generated artifact provenance and privacy
        run: python3 -B scripts/build_hosted_artifact.py verify --directory "$RUNNER_TEMP/demo-artifact/payload"
      - name: Retain CI artifact for the exact revision
        uses: actions/upload-artifact@v4
        with:
          name: demo-local-build-${{ matrix.os }}
          path: ${{ runner.temp }}/demo-artifact/payload
          retention-days: 7
      - name: Run Rust fixtures
        run: cargo test --locked --workspace
      - name: Lint all Rust targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  fixtures:
    name: Browser and Python fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.8.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"
      - name: Run browser and Worker fixtures
        run: node --test crates/opaque-showcase/tests/*.test.cjs deploy/cloudflare-demo/tests/*.test.mjs
      - name: Check complete standalone publication artifact
        run: python3 -B scripts/check_site_privacy.py --build
      - name: Run local script fixtures
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Run hosted runtime and controller fixtures
        run: python -B -m unittest discover -s deploy/hosted-demo -p 'test_*.py'
