apiVersion: policy.opaque.dev/v1alpha1
kind: AuthorityPolicy
metadata:
  name: ax-support-status
  namespace: demo
spec:
  tenantRef: opaque-ax-demo
  connectorRef: support-fixture
  authority:
    operation: support.case.setStatus
    allowedStatuses: [resolved]
    maxResources: 2
    maxAttempts: 2
    maxDuration: 10m
  approval:
    scope: Required
    action: WithinApprovedScope
    reviewerRef: native-reviewer
