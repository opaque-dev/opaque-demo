[workspace]
resolver = "2"
members = ["crates/opaque-showcase"]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/opaque-dev/opaque-demo"
homepage = "https://opaque.info"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# Consume the public contract at a reviewed immutable revision; never depend on
# a sibling checkout or import private workspace implementation into core.
opaque-core = { git = "https://github.com/opaque-dev/opaque.git", rev = "92c854f2ef0d67fece04d43fd4a3147a911368f6" }
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5.30", features = ["derive"] }
futures-util = { version = "0.3.30", features = ["sink"] }
getrandom = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
libc = "0.2.170"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time", "process"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
wiremock = "0.6"
